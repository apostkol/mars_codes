[project]
name = "mars_currents"
version = "1.0.0"
authors = [
  { name="Apostolos Kolokotronis", email="apostolos.kolokotronis@irf.se" },
]
description = "Package to map the induced magnetic field and current densities around Mars, using MAVEN data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "astropy>=6.1.3",
    "cdflib>=1.3.1",
    "matplotlib>=3.9.2",
    "numpy>2.1.0",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "pyvista>=0.48.4",
    "scipy>=1.14.1",
    "spiceypy>=6.0.0",
    "xarray>=2024.10.0",
]

[project.urls]
Homepage = "https://github.com/apostkol/mars-electrodynamic-currents"

[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
git = [
    "pre-commit",
]
style = [
    "ruff"
]
tests = [
    "nbmake",
    "pytest",
    "pytest-cov",
]
docs = [
    "nbsphinx>=0.9.2",
    "numpydoc>=1.5.0",
    "pydata-sphinx-theme>=0.13.0",
    "sphinx>=7.0.0",
    "sphinx-codeautolink>=0.15.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-gallery>=0.13.0",
    "sphinxcontrib-apidoc>=0.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mars_currents*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning",
]


[tool.bumpver]
current_version = "1.0.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = false
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"mars_currents/__init__.py" = ["{version}", "Copyright 2020-YYYY"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "jupyter>=1.1.1",
    "jupytext>=1.14.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]


[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E402", "E741", "E501"]

[tool.jupytext.formats]
ipynb = "ipynb"
py = "percent"


